<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Diccionario Wanakana</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      width: 400px;
    }

    h2 {
      border-bottom: 2px solid #ff69b4;
      padding-bottom: 5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      background: #ff69b4;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #e05297;
    }

    .word-list {
      margin-top: 20px;
      border-top: 1px solid #ddd;
      max-height: 300px;
      overflow-y: auto;
    }

    .word-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }

    .delete-btn {
      background: #ff4444;
      width: auto;
      padding: 2px 8px;
      margin: 0;
      font-size: 0.8em;
    }
  </style>
</head>

<body>
  <h2>Diccionario Cloud</h2>

  <div class="form-group">
    <label>Hiragana / Raíz (Ej: はな)</label>
    <input type="text" id="inputClave" placeholder="Escribe en hiragana">
  </div>
  <div class="form-group">
    <label>Kanji (Ej: 花)</label>
    <input type="text" id="inputValor" placeholder="Kanji resultante">
  </div>
  <div class="form-group">
    <label>Tipo</label>
    <select id="tipoEntrada">
      <option value="sustantivos">Sustantivo / Exacto</option>
      <option value="raicesVerbos">Raíz Verbal (Comienza con...)</option>
    </select>
  </div>
  <button id="btnGuardar">Guardar y Sincronizar</button>

  <div class="word-list" id="listaPalabras">
  </div>

  <script src="options.js"></script>
</body>

</html>
