<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Diccionario Wanakana</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <h2>Diccionario Cloud</h2>
  <div style="margin-bottom: 15px; text-align: right;">
    <button id="btnExportar" style="width: auto; background: #2196F3;">⬇ Exportar Backup</button>
    <button id="btnImportar" style="width: auto; background: #FF9800;">⬆ Importar Backup</button>
    <input type="file" id="fileInput" style="display: none" accept=".json">
  </div>
  <div class="form-group">
    <label>Hiragana / Raíz (Ej: はな)</label>
    <input type="text" id="inputClave" placeholder="Escribe en hiragana">
  </div>
  <div class="form-group">
    <label>Kanji (Ej: 花)</label>
    <input type="text" id="inputValor" placeholder="Kanji resultante">
  </div>
  <div class="form-group">
    <label>Tipo</label>
    <select id="tipoEntrada">
      <option value="sustantivos">Sustantivo / Exacto</option>
      <option value="raicesVerbos">Raíz Verbal (Comienza con...)</option>
    </select>
  </div>
  <button id="btnGuardar">Guardar y Sincronizar</button>

  <div class="word-list" id="listaPalabras">
  </div>

  <script src="options.js"></script>
</body>

</html>
