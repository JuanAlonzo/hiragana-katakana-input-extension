<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Configuracion WanaInput</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <header>
    <h2>🌸 WanaInput</h2>
    <div class="toolbar">
      <button id="btnExportar" class="btn btn-secondary">⬇ Backup</button>
      <button id="btnImportar" class="btn btn-secondary">⬆ Restaurar</button>
      <input type="file" id="fileInput" style="display: none" accept=".json">
    </div>
  </header>

  <div class="container">

    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <label>Hiragana / Raíz</label>
          <input type="text" id="inputClave" placeholder="Ej: はな">
        </div>
        <div class="form-group">
          <label>Kanji / Resultado</label>
          <input type="text" id="inputValor" placeholder="Ej: 花">
        </div>
      </div>
      <div class="form-group" style="margin-bottom: 10px;">
        <label>Tipo de Conversión</label>
        <select id="tipoEntrada">
          <option value="sustantivos">Sustantivo / Palabra Exacta</option>
          <option value="raicesVerbos">Raíz Verbal (Empieza con...)</option>
        </select>
      </div>
      <button id="btnGuardar" class="btn btn-primary">Guardar en la Nube</button>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="inputBuscador" placeholder="Buscar palabra...">
    </div>

    <div class="word-list" id="listaPalabras">
    </div>
  </div>

  <script src="wanakana.js"></script>
  <script src="vocabulario.js"></script>
  <script src="options.js"></script>
</body>

</html>
